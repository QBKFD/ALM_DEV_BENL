[project]
name = "alm-model-benl"
version = "0.1.0"
description = "Out-of-sample test of deposit pass-through models for NL and BE savings, 2022-2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
